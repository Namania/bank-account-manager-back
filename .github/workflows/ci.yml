name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint
      run: pylint $(git ls-files '*.py')

    - name: Tests
      run: python manage.py test app --settings=bankAccountManager.settings_test

    - name: Dependency audit
      run: pip-audit -r requirements.txt

    - name: Static security analysis
      run: bandit -q -ll -r app bankAccountManager -x app/tests

  postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bank
          POSTGRES_USER: bank
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bank -d bank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE: postgres
      POSTGRES_DB: bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: ci-only
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Tests on PostgreSQL (row locks, concurrency)
      run: python manage.py test app --settings=bankAccountManager.settings_test --noinput

  # Runs only when both test jobs passed, and only for a push to main.
  release:
    needs: [checks, postgres]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to push the git tag
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bank-account-manager-back
      VERSION: 1.0.${{ github.run_number }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Log in to Docker Hub
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Build and push the image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        push: true
        tags: |
          ${{ env.IMAGE }}:${{ env.VERSION }}
          ${{ env.IMAGE }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Only reached when the push succeeded: the tag always points at a published image.
    - name: Tag the commit
      run: |
        git tag "v$VERSION"
        git push origin "v$VERSION"
