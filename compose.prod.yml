x-app-environment: &app-environment
  DEBUG: "False"
  HTTPS_ONLY: "True"
  NUM_PROXIES: "1"
  AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-Lax}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in the Dokploy environment}
  ALLOWED_HOSTS: ${API_DOMAIN:?set API_DOMAIN, for example api.example.org}
  CSRF_TRUSTED_ORIGINS: ${FRONT_ORIGIN:?set FRONT_ORIGIN, for example https://app.example.org},https://${API_DOMAIN}
  CORS_ALLOWED_ORIGINS: ${FRONT_ORIGIN}
  POSTGRES_DB: bank_account_manager
  POSTGRES_USER: bank
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the Dokploy environment}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"

services:
  api:
    image: ${DOCKER_IMAGE:?set DOCKER_IMAGE, for example myuser/bank-account-manager-back}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment: *app-environment
    expose:
      - 5555
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:5555/health/', headers={'Host': os.environ['ALLOWED_HOSTS'].split(',')[0].strip()}), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - internal
      - dokploy-network

  scheduler:
    image: ${DOCKER_IMAGE}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      api:
        condition: service_healthy
    command: ["sh", "-c", "while true; do python manage.py run_recurring; sleep 3600; done"]
    networks:
      - internal

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bank_account_manager
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank_account_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
  dokploy-network:
    external: true
