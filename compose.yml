services:
  api:
    build: .
    container_name: bank-account-mngt-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-5555}:5555"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:5555/health/', headers={'Host': os.environ['ALLOWED_HOSTS'].split(',')[0].strip()}), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  scheduler:
    build: .
    container_name: bank-account-mngt-scheduler
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    command: ["sh", "-c", "while true; do python manage.py run_recurring; sleep 3600; done"]

  db:
    image: postgres:16
    container_name: bank-account-mngt-db
    command: postgres -p ${POSTGRES_PORT}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:${POSTGRES_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
